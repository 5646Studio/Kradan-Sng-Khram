# ===== wrangler.toml — สุวรรณภูมิ Game Server =====
# วางไฟล์นี้ไว้หน้าแรกของ repo (ระดับเดียวกับ index.html)

name = "suwannaphum-war"
main = "server/worker.js"
compatibility_date = "2026-10-12"

# ให้ค่า Variables / Secrets ที่ตั้งไว้ในหน้าเว็บ Cloudflare อยู่ต่อ
# (FIREBASE_PROJECT_ID, ADMIN_UIDS, ALLOW_ORIGIN, PAYMENT_ENABLED)
keep_vars = true

# Cron ทุก 5 นาที (เหมือนที่ตั้งไว้เดิม)
[triggers]
crons = ["*/5 * * * *"]

# ฐานข้อมูล D1 (โค้ดเรียกใช้ env.DB)
[[d1_databases]]
binding = "DB"
database_name = "suwannaphum"
database_id = "39055c37-f347-401c-a5f4-fe63579cb0b2"
